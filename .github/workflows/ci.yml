name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip install --only-binary=:all: lifelines || echo "lifelines unavailable; cross-check tests will skip"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t odsim .
      - name: Smoke-test the container
        run: |
          docker run -d -p 8000:8000 --name odsim odsim
          for i in $(seq 1 20); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs odsim; exit 1
